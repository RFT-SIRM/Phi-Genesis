name: theta=2pi local-face audit

on:
  push:
    branches:
      - formalize/h10-lean4
    paths:
      - "computational/spectral_gap_theta_2pi/**"
      - "PhiGenesis/SpectralGap/**/*.lean"
      - "phi_genesis/sg_laplacian.py"
      - "phi_genesis/mobius.py"
      - ".github/workflows/spectral-gap-theta2pi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Run exact, graph, and spectral audits
        run: >-
          python computational/spectral_gap_theta_2pi/audit_triangle_gauge.py
          --max-level 10
          --compare-repo-max-level 8
          --spectral-max-level 8
          --compare-hole-solver-max-level 6
