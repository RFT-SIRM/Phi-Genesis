name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Install test deps
        run: pip install pytest
      - name: Run fast tests (nightly-marked deep tests run separately, see nightly-deep-tests.yml)
        run: pytest -v -m "not nightly"
