name: Lean 4

on:
  push:
    branches: [ "formalize/h10-lean4" ]
    paths:
      - "PhiGenesis.lean"
      - "PhiGenesis/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build (pinned Lean + Mathlib)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build with Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
