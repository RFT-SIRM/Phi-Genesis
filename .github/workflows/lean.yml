name: Lean formalization

on:
  push:
    branches: [ "formalize/**" ]
    paths:
      - "PhiGenesis.lean"
      - "PhiGenesis/**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "PhiGenesis.lean"
      - "PhiGenesis/**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        timeout-minutes: 20
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build formalization
        run: lake build PhiGenesis
