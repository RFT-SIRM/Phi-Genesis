name: Deploy Phi-Genesis visual research site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build supporting research documentation
        run: mkdocs build --strict --site-dir site

      - name: Restore the original full HTML visualizations
        run: |
          mkdir -p site/interactive
          cp visual/index.html site/index.html
          cp visual/interactive/index.html site/interactive/index.html
          cp docs/history.html site/history.html

      - name: Verify visual HTML entry points
        run: |
          test -s site/index.html
          test -s site/interactive/index.html
          test -s site/history.html
          grep -q "Phi-Genesis" site/index.html
          grep -q "Interactive Research Portal" site/index.html
          grep -q 'build-revision" content="2026-10-17-ultracore-shell-phi-genesis-root-1' site/index.html
          grep -q '<canvas id="field"' site/index.html
          grep -q 'data-title=' site/index.html
          grep -q 'href="verified-results/"' site/index.html
          ! grep -q 'href="../verified-results/"' site/index.html
          grep -q "Interactive Research Portal" site/interactive/index.html
          grep -q 'build-revision" content="2026-10-17-ultracore-shell-phi-genesis-1' site/interactive/index.html
          grep -q '<canvas id="field"' site/interactive/index.html
          grep -q 'data-title=' site/interactive/index.html
          grep -q "Phi-Genesis" site/interactive/index.html
          grep -q 'href="../history.html"' site/interactive/index.html
          grep -q "Phi-Genesis" site/history.html

      - name: Verify supporting research-record routes
        run: |
          test -s site/methodology/index.html
          test -s site/protocol-ledger/index.html
          test -s site/preregistration/index.html
          grep -q 'href="methodology/"' site/history.html
          grep -q 'href="protocol-ledger/"' site/history.html
          grep -q 'href="preregistration/"' site/history.html
          grep -q 'protocol_ledger.md' site/protocol-ledger/index.html
          grep -q 'PREREGISTRATION_v1.2.1.md' site/preregistration/index.html
          grep -q 'METHODOLOGY.md' site/methodology/index.html

      - name: Publish GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
