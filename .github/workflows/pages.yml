name: Deploy Phi-Genesis visual research site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build supporting research documentation
        run: mkdocs build --strict --site-dir site

      - name: Add .html aliases for branch-based GitHub Pages
        run: |
          for page in research-home research-map verified-results open-problems selection-protocol reproducibility data-and-provenance methodology protocol-ledger preregistration; do
            test -s "site/${page}/index.html"
            cp "site/${page}/index.html" "site/${page}.html"
          done

      - name: Restore the original full HTML visualizations
        run: |
          mkdir -p site/interactive
          cp visual/index.html site/index.html
          cp visual/interactive/index.html site/interactive/index.html
          cp docs/history.html site/history.html

      - name: Verify visual HTML entry points
        run: |
          test -s site/index.html
          test -s site/interactive/index.html
          test -s site/history.html
          grep -q "Phi-Genesis" site/index.html
          grep -q "Interactive Research Portal" site/index.html
          grep -q 'build-revision" content="2026-10-17-ultracore-shell-phi-genesis-root-1' site/index.html
          grep -q '<canvas id="field"' site/index.html
          grep -q 'data-title=' site/index.html
          grep -q 'href="verified-results.html"' site/index.html
          grep -q 'data-link="research-map.html"' site/index.html
          grep -q 'data-link="verified-results.html"' site/index.html
          grep -q 'data-link="selection-protocol.html"' site/index.html
          grep -q 'data-link="open-problems.html"' site/index.html
          ! grep -q 'href="../verified-results/' site/index.html
          grep -q "Interactive Research Portal" site/interactive/index.html
          grep -q 'build-revision" content="2026-11-03-h10-math-audit-1' site/interactive/index.html
          grep -q '<canvas id="field"' site/interactive/index.html
          grep -q 'data-title=' site/interactive/index.html
          grep -q "Phi-Genesis" site/interactive/index.html
          grep -q 'href="../history.html"' site/interactive/index.html
          grep -q 'href="../verified-results.html"' site/interactive/index.html
          grep -q 'href="../research-map.html"' site/interactive/index.html
          grep -q 'data-link="../research-map.html"' site/interactive/index.html
          grep -q 'data-link="../verified-results.html"' site/interactive/index.html
          grep -q 'data-link="../selection-protocol.html"' site/interactive/index.html
          grep -q 'data-link="../open-problems.html"' site/interactive/index.html
          grep -q "Phi-Genesis" site/history.html


      - name: Verify MathJax formulas in published HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for filename in ("site/index.html", "site/interactive/index.html"):
              source = Path(filename).read_text(encoding="utf-8")
              body = re.sub(r"<script\b[^>]*>.*?</script>", "", source, flags=re.I | re.S)
              assert "mathjax@3/es5/tex-chtml.js" in source, f"MathJax loader missing: {filename}"
              assert "window.MathJax" in source, f"MathJax configuration missing: {filename}"
              assert "$" not in body, f"Raw dollar delimiters found: {filename}"
              assert body.count(r"\(") == body.count(r"\)"), f"Unbalanced inline math delimiters: {filename}"
              assert body.count(r"\[") == body.count(r"\]"), f"Unbalanced display math delimiters: {filename}"
              assert "Cambria Math" in source, f"Math-friendly typography missing: {filename}"
              print(f"MathJax markup OK: {filename}")

          for filename in ("site/verified-results/index.html", "site/open-problems/index.html", "site/higher-moments-z2/index.html"):
              page = Path(filename).read_text(encoding="utf-8")
              has_mathjax = "mathjax@3/es5/tex-mml-chtml.js" in page or "mathjax@3/es5/tex-chtml.js" in page
              assert has_mathjax, f"MathJax loader missing from generated documentation: {filename}"
              assert "arithmatex" in page, f"Expected arithmatex markup missing: {filename}"
              print(f"Generated documentation math OK: {filename}")
          PY
      - name: Verify supporting research-record routes
        run: |
          test -s site/methodology/index.html
          test -s site/protocol-ledger/index.html
          test -s site/preregistration/index.html
          test -s site/research-home.html
          test -s site/methodology.html
          test -s site/protocol-ledger.html
          test -s site/preregistration.html
          grep -q 'href="methodology.html"' site/history.html
          grep -q 'href="protocol-ledger.html"' site/history.html
          grep -q 'href="preregistration.html"' site/history.html
          grep -q 'protocol_ledger.md' site/protocol-ledger/index.html
          grep -q 'PREREGISTRATION_v1.2.1.md' site/preregistration/index.html
          grep -q 'METHODOLOGY.md' site/methodology/index.html

      - name: Publish GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
          enable_jekyll: false
