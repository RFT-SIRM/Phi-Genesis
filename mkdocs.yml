site_name: Phi-Genesis
site_url: https://rft-sirm.github.io/Phi-Genesis/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    logo: material/atom-variant

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RFT-SIRM/Phi-Genesis

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Interactive Portal: interactive.md
  - Research Map: research-map.md
  - Application Programmes: application-programmes.md
  - Ecosystem Control: ecosystem-control.md
  - History: history.md
  - Origin Chronology: origin-chronology.md
  - Platform:
      - Overview: platform.md
      - Reproducibility: reproducibility.md
      - Data & Provenance: data-and-provenance.md
  - Architecture:
      - Overview: architecture.md
      - Computational Architecture: computational-architecture.md
  - Foundations:
      - Overview: foundations.md
      - Verified Results: verified-results.md
      - Methodology: methodology.md
      - Glossary: glossary.md
  - Strategy:
      - Overview: strategy.md
      - Selection Protocol: selection-protocol.md
      - Preregistration: preregistration.md
      - Protocol Ledger: protocol-ledger.md
      - Open Problems: open-problems.md
  - Implementation:
      - Overview: implementation.md
      - Changelog: changelog.md
  - Field Trials: field_trials.md
  - seL4 CDT Verification: field_trials_sel4.md
  - Support: support.md
