site_name: Phi-Genesis
exclude_docs: |
  /index.html
site_description: Reproducible spectral research on the Sierpiński gasket, with explicit evidence boundaries and an auditable research history.
site_url: https://rft-sirm.github.io/Phi-Genesis/
repo_url: https://github.com/RFT-SIRM/Phi-Genesis
repo_name: RFT-SIRM/Phi-Genesis
theme:
  name: material
  logo: null
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
nav:
  - Home: index.md
  - Interactive Portal: interactive.md
  - Research History: https://rft-sirm.github.io/Phi-Genesis/history.html
  - Research Records:
      - Methodology: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/METHODOLOGY.md
      - Protocol Ledger: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/protocol_ledger.md
      - Preregistration v1.2.1: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/PREREGISTRATION_v1.2.1.md
      - Changelog: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/CHANGELOG.md
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RFT-SIRM/Phi-Genesis
    - icon: fontawesome/solid/envelope
      link: mailto:evgeniyzaprudnov@gmail.com
extra_css:
  - stylesheets/phi-genesis.css
plugins:
  - search
