site_name: Phi-Genesis
exclude_docs: |
  /index.html
site_description: Reproducible spectral research on the Sierpiński gasket, with explicit evidence boundaries and an auditable research history.
site_url: https://rft-sirm.github.io/Phi-Genesis/
repo_url: https://github.com/RFT-SIRM/Phi-Genesis
repo_name: RFT-SIRM/Phi-Genesis
theme:
  name: material
  icon:
    logo: material/atom-variant
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
nav:
  - Home: index.md
  - Research Map: research-map.md
  - Results & Evidence: verified-results.md
  - Selection Protocol: selection-protocol.md
  - Open Problems: open-problems.md
  - Methods & Reproducibility:
      - Methodology: methodology.md
      - Reproducibility: reproducibility.md
      - Computational Architecture: computational-architecture.md
      - Data & Provenance: data-and-provenance.md
  - Interactive Portal: https://rft-sirm.github.io/Phi-Genesis/interactive/
  - Research History: https://rft-sirm.github.io/Phi-Genesis/history.html
  - Primary Records:
      - README and current status: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/README.md
      - Methodology source: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/METHODOLOGY.md
      - Protocol Ledger: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/protocol_ledger.md
      - Preregistration v1.2.1: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/PREREGISTRATION_v1.2.1.md
      - Changelog: https://github.com/RFT-SIRM/Phi-Genesis/blob/main/CHANGELOG.md
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RFT-SIRM/Phi-Genesis
    - icon: fontawesome/solid/envelope
      link: mailto:evgeniyzaprudnov@gmail.com
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/phi-genesis.css
plugins:
  - search
