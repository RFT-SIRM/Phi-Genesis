[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-genesis"
version = "2.1.0"
description = "Honest spectral computation on the Sierpinski gasket + fermion mass-formula audit"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
packages = ["phi_genesis"]

[tool.pytest.ini_options]
markers = [
    "nightly: slow/expensive tests (level-9 spectral convergence attempt, Gate-E Monte-Carlo null-test sweep) run once a day via .github/workflows/nightly-deep-tests.yml, not on every push/PR.",
]
