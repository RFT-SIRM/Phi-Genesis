[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-genesis"
version = "2.2.1"
description = "Reproducible spectral research on Sierpiński-gasket graph Laplacians, signed boundary flux, spectral decimation, and numerical evidence audits"
authors = [{ name = "Evgeny Zaprudnov", email = "evgeniyzaprudnov@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mpmath>=1.3"]

[tool.setuptools]
packages = ["phi_genesis"]

[tool.pytest.ini_options]
markers = [
    "nightly: slow/expensive tests (level-9 spectral convergence attempt, Gate-E Monte-Carlo null-test sweep) run once a day via .github/workflows/nightly-deep-tests.yml, not on every push/PR.",
]
